# Run `pre-commit install` once; CI runs the same hooks on every pull request.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        exclude: ^charts/[^/]+/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/norwoodj/helm-docs
    rev: 37d3055fece566105cf8cff7c17b7b2355a01677 # frozen: v1.14.2
    hooks:
      - id: helm-docs-built
        args: [--chart-search-root=charts]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        args: [--persona=pedantic]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 6ebe81750a4c5da12fdfade64c40099df83e3386 # frozen: 44.181.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
