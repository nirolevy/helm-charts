name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: v1.2.1
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run hooks
        run: |
          pip install --disable-pip-version-check "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure --color never 2>&1 | tee pre-commit.log
          exit "${PIPESTATUS[0]}"

      # Puts the end of the output in an annotation, so it shows on the pull request without opening the log.
      - name: Annotate failure
        if: failure()
        run: hack/annotate.sh pre-commit pre-commit.log

  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: List changed charts
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            charts=$(ct list-changed --config ct.yaml | tr '\n' ' ')
          else
            charts=$(find charts -mindepth 1 -maxdepth 1 -type d | sort | tr '\n' ' ')
          fi
          echo "Charts: $charts"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

      - name: chart-testing lint
        if: steps.changed.outputs.charts != ''
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ct lint --config ct.yaml --lint-conf .yamllint.yaml
          else
            ct lint --config ct.yaml --lint-conf .yamllint.yaml --all --check-version-increment=false
          fi

      - name: Unit tests
        if: steps.changed.outputs.charts != ''
        env:
          CHARTS: ${{ steps.changed.outputs.charts }}
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false
          for chart in $CHARTS; do
            helm dependency build "$chart"
            helm unittest --strict "$chart"
          done

  install:
    name: Install on Kubernetes ${{ matrix.k8s }}
    needs: lint-test
    if: needs.lint-test.outputs.changed != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: "1.31"
            image: kindest/node:v1.31.14@sha256:6f86cf509dbb42767b6e79debc3f2c32e4ee01386f0489b3b2be24b0a55aac2b
          - k8s: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          node_image: ${{ matrix.image }}
          wait: 120s

      # Installs each chart once per file in its ci/ folder and runs `helm test`.
      # On pull requests it also upgrades from the version on main.
      - name: chart-testing install
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ct install --config ct.yaml --upgrade 2>&1 | tee ct.log
          else
            ct install --config ct.yaml --all 2>&1 | tee ct.log
          fi

      - name: Annotate failure
        if: failure()
        env:
          K8S: ${{ matrix.k8s }}
        run: |
          {
            grep -vE '^\s*$' ct.log | tail -n 60
            echo '--- pods'
            kubectl get pods --all-namespaces -o wide
            echo '--- warning events'
            kubectl get events --all-namespaces --field-selector type=Warning --sort-by=.lastTimestamp | tail -n 30
          } > failure.txt 2>&1 || true
          hack/annotate.sh "install on $K8S" failure.txt

  # The single check to require in branch protection.
  ci-ok:
    name: CI OK
    if: always()
    needs: [pre-commit, lint-test, install]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "A required job ended with: $result"
              exit 1
            fi
          done
