name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.1
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION: v1.2.1
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: 4.7.0
  # renovate: datasource=github-releases depName=prometheus/prometheus
  PROMETHEUS_VERSION: v3.16.0
  # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator
  PROMETHEUS_OPERATOR_VERSION: v0.95.1
  # renovate: datasource=github-releases depName=grafana/grafana-operator
  GRAFANA_OPERATOR_VERSION: v5.25.0

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Run hooks
        run: |
          pip install --disable-pip-version-check "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure --color never 2>&1 | tee pre-commit.log
          exit "${PIPESTATUS[0]}"

      # Puts the end of the output in an annotation, so it shows on the pull request without opening the log.
      - name: Annotate failure
        if: failure()
        run: hack/annotate.sh pre-commit pre-commit.log

  lint-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changed.outputs.charts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: List changed charts
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            charts=$(ct list-changed --config ct.yaml | tr '\n' ' ')
          else
            charts=$(find charts -mindepth 1 -maxdepth 1 -type d | sort | tr '\n' ' ')
          fi
          echo "Charts: $charts"
          echo "charts=$charts" >> "$GITHUB_OUTPUT"

      - name: chart-testing lint
        if: steps.changed.outputs.charts != ''
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ct lint --config ct.yaml --lint-conf .yamllint.yaml
          else
            ct lint --config ct.yaml --lint-conf .yamllint.yaml --all --check-version-increment=false
          fi

      - name: Alert tests (promtool)
        if: contains(steps.changed.outputs.charts, 'charts/qui')
        run: |
          pip install --disable-pip-version-check pyyaml==6.0.3
          version=${PROMETHEUS_VERSION#v}
          base="https://github.com/prometheus/prometheus/releases/download/$PROMETHEUS_VERSION"
          curl -fsSLO "$base/prometheus-$version.linux-amd64.tar.gz"
          curl -fsSL "$base/sha256sums.txt" | grep " prometheus-$version.linux-amd64.tar.gz\$" | sha256sum -c -
          sudo tar -xzf "prometheus-$version.linux-amd64.tar.gz" -C /usr/local/bin --strip-components=1 "prometheus-$version.linux-amd64/promtool"
          helm dependency build charts/qui
          hack/test-alerts.sh

      - name: Unit tests
        if: steps.changed.outputs.charts != ''
        env:
          CHARTS: ${{ steps.changed.outputs.charts }}
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false
          for chart in $CHARTS; do
            helm dependency build "$chart"
            helm unittest --strict "$chart"
          done

  install:
    name: Install on Kubernetes ${{ matrix.k8s }}
    needs: lint-test
    if: needs.lint-test.outputs.changed != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kubernetes releases that still get updates, oldest first. The Grafana Operator CRDs need
          # a newer API server than 1.31.
          - k8s: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - k8s: "1.36"
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - k8s: "1.37"
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          node_image: ${{ matrix.image }}
          wait: 120s

      # The monitoring objects need their CRDs. No operator runs: the API server only validates them.
      - name: Install monitoring CRDs
        run: |
          exec > >(tee crd.log) 2>&1
          prometheus="https://github.com/prometheus-operator/prometheus-operator/releases/download/$PROMETHEUS_OPERATOR_VERSION"
          grafana="https://github.com/grafana/grafana-operator/releases/download/$GRAFANA_OPERATOR_VERSION"
          kubectl apply --server-side -f "$prometheus/stripped-down-crds.yaml"
          kubectl apply --server-side -f "$grafana/crds.yaml"
          kubectl wait --for condition=Established --timeout=60s \
            crd/servicemonitors.monitoring.coreos.com \
            crd/prometheusrules.monitoring.coreos.com \
            crd/grafanadashboards.grafana.integreatly.org

      # Installs each chart once per file in its ci/ folder and runs `helm test`.
      # On pull requests it also upgrades from the version on main.
      - name: chart-testing install
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ct install --config ct.yaml --upgrade 2>&1 | tee ct.log
          else
            ct install --config ct.yaml --all 2>&1 | tee ct.log
          fi

      - name: Annotate failure
        if: failure()
        env:
          K8S: ${{ matrix.k8s }}
        run: |
          {
            [ -f crd.log ] && tail -n 30 crd.log
            [ -f ct.log ] && grep -vE '^\s*$' ct.log | tail -n 60
            echo '--- pods'
            kubectl get pods --all-namespaces -o wide
            echo '--- warning events'
            kubectl get events --all-namespaces --field-selector type=Warning --sort-by=.lastTimestamp | tail -n 30
          } > failure.txt 2>&1 || true
          hack/annotate.sh "install on $K8S" failure.txt

  # The single check to require in branch protection.
  ci-ok:
    name: CI OK
    if: always()
    needs: [pre-commit, lint-test, install]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "A required job ended with: $result"
              exit 1
            fi
          done
